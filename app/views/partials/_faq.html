{% set half = (content.faq | length + 1) // 2 %}
<section class="faq container" id="faq">
  <h2 class="section-title">{{ content.faq_title }}</h2>

  <div class="faq__grid">
    {% for column in [content.faq[:half], content.faq[half:]] %}
      <div class="faq__col">
        {% for item in column %}
          <details class="faq__item">
            <summary>{{ item.question }}</summary>
            <div class="faq__answer">
              {% for p in item.answer %}<p>{{ p }}</p>{% endfor %}
            </div>
          </details>
        {% endfor %}
      </div>
    {% endfor %}
  </div>
</section>
