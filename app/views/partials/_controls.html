{# Controles fijos arriba a la derecha: idioma + modo claro/oscuro #}
<div class="site-controls">
  <nav class="lang-switch" aria-label="{{ content.ui.language_nav }}">
    {% for language in content.languages %}
      <a href="{{ url_for('main.index', lang=language.code) }}" hreflang="{{ language.code }}"
         lang="{{ language.code }}" title="{{ language.name }}"
         {% if language.active %}aria-current="page"{% endif %}>{{ language.code | upper }}</a>
    {% endfor %}
  </nav>

  <button class="theme-toggle" type="button" data-theme-toggle
          aria-label="{{ content.ui.theme_toggle }}" title="{{ content.ui.theme_toggle }}">
    <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>
    </svg>
  </button>
</div>
