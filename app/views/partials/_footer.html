{% set f = content.footer %}
<footer class="footer container">
  <form class="newsletter" action="{{ url_for('main.subscribe') }}" method="post" data-newsletter
        data-error="{{ layout.ui.network_error }}">
    <h3 class="newsletter__title">{{ f.newsletter_title }}</h3>
    <input type="hidden" name="lang" value="{{ layout.lang }}">
    <input class="newsletter__input" type="email" name="email" required
           placeholder="{{ f.newsletter_placeholder }}" aria-label="Email">
    <button class="newsletter__button" type="submit">
      {{ f.newsletter_button }}
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <p class="newsletter__msg" role="status" data-newsletter-msg></p>
  </form>

  <ul class="social">
    {% for link in f.social %}
      <li>
        <a href="{{ link.url }}" target="_blank" rel="noopener">
          {{ link.label }}
          {% if loop.index == 1 %}
            <svg class="icon icon--ig" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" class="fill"/></svg>
          {% else %}
            <svg class="icon icon--yt" viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="4.5" width="21" height="15" rx="4"/><path d="M10 9v6l5-3z"/></svg>
          {% endif %}
        </a>
      </li>
    {% endfor %}
  </ul>

  <a class="footer__email" href="mailto:{{ f.email }}">{{ f.email }}</a>
</footer>
