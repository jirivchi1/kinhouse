{# "Cómo funciona" en 3 pasos, justo antes del calendario #}
{% set hiw = content.how_it_works %}
<section class="steps container" id="how-it-works">
  <h2 class="section-title">{{ hiw.title }}</h2>

  <ol class="steps__list">
    {% for step in hiw.steps %}
      <li class="step">
        <span class="step__number" aria-hidden="true">{{ step.number }}</span>
        <h3 class="step__title">{{ step.title }}</h3>
        <p class="step__text">{{ step.text }}</p>
      </li>
    {% endfor %}
  </ol>

  <p class="steps__prices">{{ hiw.prices }}</p>
  <div class="cta-wrap cta-wrap--tight">
    <a class="cta" href="#calendar">{{ hiw.cta }}</a>
  </div>
</section>
